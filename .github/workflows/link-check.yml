# Weekly broken-link check over every built page (free: lychee on a public repo).
# Writes seo/link-report.md; the Monday morning writer run fixes what it lists
# (PLAYBOOK step 0). Never fails the build, it only reports.
name: Link check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --exclude-mail --max-concurrency 4
            --accept 200,206,429,403,999
            --root-dir ${{ github.workspace }}
            './*.html' './guides/**/*.html'
          output: ./seo/link-report.md
          format: markdown
          fail: false
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/link-report.md
          git diff --cached --quiet || (git commit -m "Update link report" && git pull --rebase -q && git push)
